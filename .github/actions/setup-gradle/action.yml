name: Setup Gradle
description: Set up Gradle with caching and encryption

inputs:
  dependency-graph:
    description: Dependency graph mode passed to gradle/actions/setup-gradle
    required: false
    default: disabled

runs:
  using: composite
  steps:
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        add-job-summary: on-failure
        cache-read-only: ${{ github.ref != 'refs/heads/master' }}
        cache-encryption-key: ${{ env.GRADLE_ENCRYPTION_KEY }}
        dependency-graph: ${{ inputs.dependency-graph }}
        dependency-graph-continue-on-failure: false
